# Prices in EUR/kWh, without VAT.
# Review every January (new network access tariffs) and whenever a provider changes its formula.

# Network access tariffs (TAR), BTN up to 20.7 kVA, set yearly by ERSE.
[[tar]]
valid_from = 2026-01-01
valid_to = 2026-12-31
source = "ERSE TAR 2026 as published by EDP: https://helpcenter.edp.pt/media/hswmizya/20251222_tarifas_acesso_redes.pdf"
simple = { simples = 0.0607 }
bi = { fora_vazio = 0.0835, vazio = 0.0158 }
tri = { ponta = 0.2452, cheias = 0.0412, vazio = 0.0158 }

# Indexed-tariff providers. Energy price, before adding the TAR:
#   energy = (max(OMIE, omie_floor) * factor + k_before_losses) * (1 + losses) + k_after_losses
# Fields left out default to: factor 1, k_before_losses 0, k_after_losses 0, no omie_floor.

[providers.coopernico-base]
name = "Coopérnico Base"
# (OMIE + 0.009) * 1.15 reproduces every price in the provider's July 2026 table.
k_before_losses = 0.009
losses = 0.15
source = "https://www.coopernico.org/storage/files/tarifario.pdf (July 2026)"
checked_on = 2026-10-25

[providers.g9-smart-index]
name = "G9 Smart Index"
# OMIE x Fadeq x (1 + losses) + GGS (0.0185) + AC (0.0080); negative OMIE counts as zero.
# G9 quotes ERSE losses as about 0.16.
omie_floor = 0.0
factor = 1.02
losses = 0.16
k_after_losses = 0.0265
source = "https://www.g9.pt/energia/perguntasfrequentes/"
checked_on = 2026-10-25
