# Build the web page, JSON API and calendar feeds from data/ and deploy them to GitHub Pages.
# The daily workflow calls this after committing new prices (its pushes, made with
# GITHUB_TOKEN, don't trigger workflows); pushes of code changes trigger it directly.
name: pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The branch tip, so a call from the daily run includes the data it just pushed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      # setup-uv publishes no major-version tag (no `v10`), so pin an exact release.
      - uses: astral-sh/setup-uv@v10.3.2

      - run: uv sync --locked

      - run: uv run luzbarata site --out _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
